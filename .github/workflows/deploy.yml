name: Deploy BETZ Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract latest BETZ version
        run: |
          rm -rf site extracted
          mkdir -p site extracted

          unzip -q BETZ_V5_Match_Modal.zip -d extracted

          INDEX=$(find extracted -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          ROOT=$(dirname "$INDEX")
          cp -R "$ROOT"/. site/

          echo "BETZ site ready:"
          ls -la site

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
