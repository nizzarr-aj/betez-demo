name: Deploy BETZ Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf site
          mkdir -p site

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "BETZ_Live_V3.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "BETZ_Live_V3.zip not found"
            exit 1
          fi

          mkdir -p /tmp/betz
          unzip -o "$ZIP_FILE" -d /tmp/betz

          INDEX=$(find /tmp/betz -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "index.html not found inside ZIP"
            exit 1
          fi

          ROOT=$(dirname "$INDEX")
          cp -R "$ROOT"/. site/

          echo "Site prepared:"
          ls -la site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
