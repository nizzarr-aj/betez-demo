name: Deploy BETZ Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. تحميل ملفات المستودع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. تجهيز نسخة BETZ من ZIP
      - name: Extract BETZ V6
        shell: bash
        run: |
          set -e

          rm -rf site extracted
          mkdir -p site extracted

          echo "Searching for BETZ V6 ZIP..."

          ZIP_FILE="BETZ_V6_Markets_BetSlip.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            echo "Available files:"
            ls -la
            exit 1
          fi

          echo "Extracting $ZIP_FILE..."
          unzip -q "$ZIP_FILE" -d extracted

          echo "Searching for index.html..."
          INDEX_FILE=$(find extracted -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found inside ZIP"
            echo "ZIP contents:"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          SITE_ROOT=$(dirname "$INDEX_FILE")

          echo "Website root: $SITE_ROOT"

          cp -R "$SITE_ROOT"/. site/

