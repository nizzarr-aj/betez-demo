name: Deploy BETZ V8

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract BETZ V8
        run: |
          rm -rf site extracted
          mkdir -p site extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "BETZ_V8*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BETZ V8 ZIP not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          INDEX_FILE=$(find extracted -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found inside ZIP"
            exit 1
          fi

          SITE_ROOT=$(dirname "$INDEX_FILE")
          cp -R "$SITE_ROOT"/. site/

          test -f site/index.html

          echo "BETZ V8 extracted successfully"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
